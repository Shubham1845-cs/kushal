<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas Drawing</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f0f0f0; padding: 20px; }
        .container { max-width: 860px; margin: 0 auto; background: white; padding: 25px; border-radius: 5px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1 { color: #333; margin-bottom: 15px; text-align: center; border-bottom: 2px solid #333; padding-bottom: 10px; }
        .controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 15px; padding: 12px; background: #f9f9f9; border: 1px solid #ddd; border-radius: 3px; }
        .controls label { font-weight: bold; font-size: 14px; }
        .controls select, .controls input { padding: 6px 10px; border: 1px solid #ddd; border-radius: 3px; font-size: 14px; }
        .btn { padding: 7px 16px; border: none; border-radius: 3px; cursor: pointer; font-weight: bold; font-size: 14px; }
        .btn-primary { background: #0066cc; color: white; }
        .btn-danger  { background: #d32f2f; color: white; }
        .btn-primary:hover { background: #0052a3; }
        .btn-danger:hover  { background: #b71c1c; }
        canvas { border: 2px solid #333; cursor: crosshair; display: block; width: 100%; }
        .info { margin-top: 10px; font-size: 13px; color: #555; text-align: center; }
    </style>
</head>
<body>
<div class="container">
    <h1>Canvas Drawing Tool</h1>

    <div class="controls">
        <label>Shape:</label>
        <select id="shape">
            <option value="line">Line</option>
            <option value="rectangle">Rectangle</option>
            <option value="circle">Circle</option>
            <option value="freehand">Freehand</option>
        </select>

        <label>Color:</label>
        <input type="color" id="color" value="#000000">

        <label>Line Width:</label>
        <select id="lineWidth">
            <option value="1">1px</option>
            <option value="2" selected>2px</option>
            <option value="4">4px</option>
            <option value="6">6px</option>
            <option value="10">10px</option>
        </select>

        <button class="btn btn-danger" onclick="clearCanvas()">Clear</button>
    </div>

    <canvas id="myCanvas" width="800" height="500"></canvas>
    <p class="info">Click and drag to draw. First click sets start point, release sets end point.</p>
</div>

<script>
    const canvas  = document.getElementById('myCanvas');
    const ctx     = canvas.getContext('2d');
    const shapeEl = document.getElementById('shape');
    const colorEl = document.getElementById('color');
    const lwEl    = document.getElementById('lineWidth');

    let isDrawing = false;
    let startX = 0, startY = 0;
    let snapshot;

    function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width  / rect.width;
        const scaleY = canvas.height / rect.height;
        return {
            x: (e.clientX - rect.left) * scaleX,
            y: (e.clientY - rect.top)  * scaleY
        };
    }

    canvas.addEventListener('mousedown', function(e) {
        isDrawing = true;
        const pos = getPos(e);
        startX = pos.x;
        startY = pos.y;
        snapshot = ctx.getImageData(0, 0, canvas.width, canvas.height);

        if (shapeEl.value === 'freehand') {
            ctx.beginPath();
            ctx.moveTo(startX, startY);
        }
    });

    canvas.addEventListener('mousemove', function(e) {
        if (!isDrawing) return;
        const pos = getPos(e);

        ctx.strokeStyle = colorEl.value;
        ctx.lineWidth   = parseInt(lwEl.value);
        ctx.lineCap     = 'round';

        if (shapeEl.value === 'freehand') {
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
            return;
        }

        // Restore snapshot for preview
        ctx.putImageData(snapshot, 0, 0);
        ctx.beginPath();

        const w = pos.x - startX;
        const h = pos.y - startY;

        if (shapeEl.value === 'line') {
            ctx.moveTo(startX, startY);
            ctx.lineTo(pos.x, pos.y);
        } else if (shapeEl.value === 'rectangle') {
            ctx.rect(startX, startY, w, h);
        } else if (shapeEl.value === 'circle') {
            const radius = Math.sqrt(w * w + h * h);
            ctx.arc(startX, startY, radius, 0, Math.PI * 2);
        }

        ctx.stroke();
    });

    canvas.addEventListener('mouseup', function() {
        isDrawing = false;
    });

    canvas.addEventListener('mouseleave', function() {
        isDrawing = false;
    });

    function clearCanvas() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
</script>
</body>
</html>
