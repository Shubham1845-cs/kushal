<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login - Multiple Attempt Security</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f0f0; padding: 20px; }
        .container { max-width: 400px; margin: 60px auto; background: white; padding: 25px; border-radius: 5px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h2 { color: #333; margin-bottom: 5px; text-align: center; }
        p { text-align: center; color: #666; font-size: 13px; margin-bottom: 15px; }
        .tabs { display: flex; gap: 5px; margin-bottom: 15px; }
        .tab { flex: 1; padding: 9px; text-align: center; cursor: pointer; background: #eee; border: none; font-size: 14px; border-radius: 3px; }
        .tab.active { background: #333; color: white; }
        .form { display: none; }
        .form.active { display: block; }
        label { display: block; font-weight: bold; margin-bottom: 4px; margin-top: 10px; font-size: 14px; }
        input { width: 100%; padding: 9px; border: 1px solid #ddd; border-radius: 3px; font-size: 14px; box-sizing: border-box; }
        button[type=submit] { width: 100%; padding: 10px; background: #333; color: white; border: none; border-radius: 3px; cursor: pointer; font-size: 15px; margin-top: 15px; font-weight: bold; }
        button[type=submit]:hover { background: #555; }
        .success { background: #e8f5e9; color: #2e7d32; padding: 10px; border-radius: 3px; margin-bottom: 12px; border-left: 4px solid #4caf50; }
        .error   { background: #ffebee; color: #c62828; padding: 10px; border-radius: 3px; margin-bottom: 12px; border-left: 4px solid #d32f2f; }
        .warning { background: #fff8e1; color: #f57f17; padding: 10px; border-radius: 3px; margin-bottom: 12px; border-left: 4px solid #ff9800; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Secure Login</h2>
        <p>Multiple Login Attempt Protection</p>

        <div th:if="${message}" class="success" th:text="${message}"></div>
        <div th:if="${error}"   class="error"   th:text="${error}"></div>
        <div th:if="${locked}"  class="warning" th:text="${locked}"></div>

        <div class="tabs">
            <button class="tab active" onclick="showTab('login')">Login</button>
            <button class="tab"        onclick="showTab('register')">Register</button>
        </div>

        <!-- Login Form -->
        <form id="loginForm" class="form active" action="/login" method="post">
            <label>Username</label>
            <input type="text" name="username" placeholder="Enter username" required>
            <label>Password</label>
            <input type="password" name="password" placeholder="Enter password" required>
            <button type="submit">Login</button>
        </form>

        <!-- Register Form -->
        <form id="registerForm" class="form" action="/register" method="post">
            <label>Username</label>
            <input type="text" name="username" placeholder="Enter username" required>
            <label>Password</label>
            <input type="password" name="password" placeholder="Min 6 characters" required minlength="6">
            <button type="submit">Register</button>
        </form>
    </div>

    <script>
        function showTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.form').forEach(f => f.classList.remove('active'));
            if (tab === 'login') {
                document.querySelectorAll('.tab')[0].classList.add('active');
                document.getElementById('loginForm').classList.add('active');
            } else {
                document.querySelectorAll('.tab')[1].classList.add('active');
                document.getElementById('registerForm').classList.add('active');
            }
        }
    </script>
</body>
</html>
