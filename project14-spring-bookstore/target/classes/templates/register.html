<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookStore - Register</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f0f0f0; padding: 20px; }
        nav { background: #333; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-radius: 5px; }
        nav a { color: white; text-decoration: none; margin-left: 15px; font-size: 14px; }
        nav .brand { color: white; font-size: 18px; font-weight: bold; }
        .card { max-width: 400px; margin: 0 auto; background: white; padding: 30px; border-radius: 5px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h2 { color: #333; margin-bottom: 20px; text-align: center; border-bottom: 2px solid #333; padding-bottom: 10px; }
        label { display: block; font-weight: bold; margin-bottom: 4px; margin-top: 12px; }
        input { width: 100%; padding: 9px; border: 1px solid #ddd; border-radius: 3px; font-size: 14px; }
        button { width: 100%; padding: 11px; background: #333; color: white; border: none; border-radius: 3px; cursor: pointer; font-size: 15px; font-weight: bold; margin-top: 15px; }
        button:hover { background: #555; }
        .success { background: #e8f5e9; color: #2e7d32; padding: 10px; border-radius: 3px; margin-bottom: 12px; border-left: 4px solid #4caf50; }
        .error   { background: #ffebee; color: #c62828; padding: 10px; border-radius: 3px; margin-bottom: 12px; border-left: 4px solid #d32f2f; }
        .link { text-align: center; margin-top: 15px; font-size: 14px; }
        .link a { color: #333; font-weight: bold; }
    </style>
</head>
<body>
    <nav>
        <span class="brand">BookStore</span>
        <div>
            <a th:href="@{/home}">Home</a>
            <a th:href="@{/catalog}">Catalog</a>
            <a th:href="@{/login}">Login</a>
        </div>
    </nav>

    <div class="card">
        <h2>Register</h2>

        <div th:if="${message}" class="success" th:text="${message}"></div>
        <div th:if="${error}"   class="error"   th:text="${error}"></div>

        <form th:action="@{/register}" method="post">
            <label>Username *</label>
            <input type="text" name="username" placeholder="Enter username" required>

            <label>Email *</label>
            <input type="email" name="email" placeholder="Enter email address" required>

            <label>Password *</label>
            <input type="password" name="password" placeholder="Min 6 characters" required minlength="6">

            <button type="submit">Register</button>
        </form>

        <p class="link">Already have an account? <a th:href="@{/login}">Login here</a></p>
    </div>
</body>
</html>
