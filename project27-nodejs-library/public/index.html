<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management System</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f0f0f0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { text-align: center; color: #333; margin-bottom: 20px; }
        .card { background: white; padding: 25px; border-radius: 5px; box-shadow: 0 0 10px rgba(0,0,0,0.1); margin-bottom: 25px; }
        h2 { color: #333; margin-bottom: 15px; border-bottom: 2px solid #5c35a0; padding-bottom: 8px; }
        label { display: block; font-weight: bold; margin-bottom: 4px; margin-top: 10px; }
        input, select { width: 100%; padding: 9px; border: 1px solid #ddd; border-radius: 3px; font-size: 14px; }
        .row { display: flex; gap: 15px; flex-wrap: wrap; }
        .row > div { flex: 1; min-width: 180px; }
        button { margin-top: 15px; padding: 10px 20px; background: #5c35a0; color: white; border: none; border-radius: 3px; cursor: pointer; font-weight: bold; }
        button:hover { background: #4a2880; }
        .success { background: #e8f5e9; color: #2e7d32; padding: 10px; border-radius: 3px; margin-bottom: 12px; border-left: 4px solid #4caf50; display: none; }
        .error   { background: #ffebee; color: #c62828; padding: 10px; border-radius: 3px; margin-bottom: 12px; border-left: 4px solid #d32f2f; display: none; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { padding: 11px 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #5c35a0; color: white; }
        tr:hover { background: #f5f5f5; }
        .btn-delete { padding: 4px 10px; background: #d32f2f; color: white; border: none; border-radius: 3px; cursor: pointer; font-size: 12px; }
        .btn-delete:hover { background: #b71c1c; }
    </style>
</head>
<body>
<div class="container">
    <h1>Library Management System</h1>

    <div class="card">
        <h2>Add New Book</h2>
        <div id="successMsg" class="success"></div>
        <div id="errorMsg"   class="error"></div>
        <div class="row">
            <div>
                <label>Title *</label>
                <input type="text" id="title" placeholder="Enter book title">
            </div>
            <div>
                <label>Author *</label>
                <input type="text" id="author" placeholder="Enter author name">
            </div>
        </div>
        <div class="row">
            <div>
                <label>Year *</label>
                <input type="number" id="year" placeholder="Publication year" min="1000" max="2099">
            </div>
            <div>
                <label>Genre</label>
                <input type="text" id="genre" placeholder="e.g. Fiction, Technology">
            </div>
        </div>
        <button onclick="addBook()">Add Book</button>
    </div>

    <div class="card">
        <h2>All Books (<span id="bookCount">0</span>)</h2>
        <table id="booksTable">
            <thead>
                <tr>
                    <th>Book ID</th>
                    <th>Title</th>
                    <th>Author</th>
                    <th>Year</th>
                    <th>Genre</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="6" style="text-align:center;padding:20px;color:#888;">Loading...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    const API = 'http://localhost:4000/api/books';

    function showMsg(type, msg) {
        const el = document.getElementById(type === 'success' ? 'successMsg' : 'errorMsg');
        const other = document.getElementById(type === 'success' ? 'errorMsg' : 'successMsg');
        el.textContent = msg;
        el.style.display = 'block';
        other.style.display = 'none';
        setTimeout(() => { el.style.display = 'none'; }, 3000);
    }

    function loadBooks() {
        fetch(API)
            .then(r => r.json())
            .then(books => {
                document.getElementById('bookCount').textContent = books.length;
                const tbody = document.getElementById('tableBody');
                if (books.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:20px;color:#888;">No books found</td></tr>';
                    return;
                }
                tbody.innerHTML = books.map(b => `
                    <tr>
                        <td>#${b.book_id}</td>
                        <td>${b.title}</td>
                        <td>${b.author}</td>
                        <td>${b.year}</td>
                        <td>${b.genre || '-'}</td>
                        <td><button class="btn-delete" onclick="deleteBook(${b.book_id})">Delete</button></td>
                    </tr>
                `).join('');
            })
            .catch(err => showMsg('error', 'Failed to load books: ' + err.message));
    }

    function addBook() {
        const title  = document.getElementById('title').value.trim();
        const author = document.getElementById('author').value.trim();
        const year   = document.getElementById('year').value.trim();
        const genre  = document.getElementById('genre').value.trim();

        if (!title || !author || !year) {
            showMsg('error', 'Title, Author and Year are required.');
            return;
        }

        fetch(API, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title, author, year: parseInt(year), genre })
        })
        .then(r => { if (!r.ok) throw new Error('Failed'); return r.json(); })
        .then(() => {
            showMsg('success', 'Book added successfully!');
            document.getElementById('title').value  = '';
            document.getElementById('author').value = '';
            document.getElementById('year').value   = '';
            document.getElementById('genre').value  = '';
            loadBooks();
        })
        .catch(err => showMsg('error', 'Error: ' + err.message));
    }

    function deleteBook(id) {
        if (!confirm('Delete this book?')) return;
        fetch(API + '/' + id, { method: 'DELETE' })
            .then(() => { showMsg('success', 'Book deleted.'); loadBooks(); })
            .catch(err => showMsg('error', 'Error: ' + err.message));
    }

    window.onload = loadBooks;
</script>
</body>
</html>
